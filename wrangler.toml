# Cloudflare Pages settings for marvel-details (read by `wrangler pages deploy`
# and `wrangler pages dev`). Secrets (FACEBOOK_APP_SECRET, X_CLIENT_SECRET) are
# set with `npx wrangler pages secret put NAME --project-name marvel-details`,
# never written here.
name = "marvel-details"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[vars]
# Google's client ID is public by design (it sits in every page that shows the
# button). Empty = Google sign-in is off. Facebook and X ids go in as secrets
# with their app secrets.
GOOGLE_CLIENT_ID = "792719591198-5b5sddbkp93carjc9hutco5hrvupb9t3.apps.googleusercontent.com"

# Accounts and sessions (migrations/). Created 2026-10-06.
[[d1_databases]]
binding = "DB"
database_name = "marvel-details"
database_id = "4bb656b4-ca84-4b65-9f4d-179585909b94"
migrations_dir = "migrations"

# Live Edit (Doug's on-page editor, signed in through webdesignnerd.com): edits, pictures, owner sessions. Created 2026-10-12.
[[kv_namespaces]]
binding = "LIVE_EDIT"
id = "23455c5ae5514c9cac0cdee2b8fb0b23"
