name: Check links
on:
  pull_request:
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/check-links.mjs
      - name: Unit tests (member perks)
        run: npm test
